title: Platform Extensions 5 - Post Actions and Dialogs
teaser: Put a button on an alert, open a form, and capture an analyst's judgement.
description: |-
  Automatic escalation catches CRITICAL alerts, but it carries no human judgement:
  nothing records why an alert matters, what the analyst checked, or what they ruled
  out.

  In this lab you add an Escalate button to the alert itself, open a dialog when it is
  clicked, and post the analyst's assessment back into the incident channel.

  **Prerequisite: Platform Extensions 4.** Modules 2 to 4 arrive already working, so
  you can start here without having taken them.
