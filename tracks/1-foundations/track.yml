title: Platform Extensions 1 - Foundations
teaser: Orientation for the Platform Extension Expert certification labs. Start here.
description: |-
  A simulated cyber threat intelligence feed needs to post alerts into Mattermost.
  Right now it has nowhere to send them, and nothing formats them.

  Start here. This track orients you: the scenario, the five hands-on labs that
  follow, how they are graded, and what you need before you begin. It provisions no
  sandbox and loads instantly.

  Take the tracks in order. Each one starts with the previous modules' work already
  in place, so you can begin a later lab without having finished an earlier one, but
  the concepts do build.

  Module 1's own theory content is still to be written.
