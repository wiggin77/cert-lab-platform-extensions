title: Platform Extensions 6 - Plugins
teaser: Move inside the server with a Go plugin, its own HTTP API, and a custom interface.
description: |-
  Everything so far has worked from outside Mattermost, reacting to it over HTTP. A
  plugin runs inside the server, and can do things no integration can.

  Two challenges. First the server side: a Go plugin that captures alerts into the KV
  Store through a hook and exposes them over its own HTTP API, including an AI
  assessment through the Agents plugin. Then the webapp side: a custom post card that
  replaces alert rendering entirely, a sidebar pane, and a channel header widget.

  **Prerequisite: Platform Extensions 5.** Modules 2 to 5 arrive already working. This
  is the longest lab and the only one that involves Go.
