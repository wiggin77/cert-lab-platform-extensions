title: Platform Extensions
teaser: Build a working Mattermost integration, one surface at a time, against a simulated
  threat alert feed.
description: |-
  Hands-on labs for the **Platform Extension Expert** certification.

  A simulated cyber threat intelligence feed posts alerts into Mattermost. Across
  five labs you extend a single integration codebase to react to those alerts,
  adding one capability per module that the previous one could not provide:

  1. **Incoming webhooks** format alerts as message attachments
  2. **Outgoing webhooks** auto-escalate CRITICAL alerts to the incident channel
  3. **Slash commands** enrich an indicator against a threat intel API
  4. **Post actions and dialogs** let an analyst escalate with their own judgement
  5. **Plugins** replace alert rendering entirely, with server and webapp components

  Every lab checks your work by firing a real alert and inspecting what Mattermost
  actually did with it. A Lab Inspector tab shows you every request in both
  directions, live, so you can see exactly what Mattermost sent and what your
  handler returned.
