version: "3"

# Hybrid topology, chosen from empirical testing on a scratch track. See DESIGN.md.
#
# Mattermost and Postgres are containers: official images, zero build, and the platform
# keeps them isolated from anything the learner breaks.
#
# The learner's mutable code stays on a VM. Container hosts have no persistent storage on
# classic Tracks (a `volumes:` entry validates and is then silently ignored, verified by
# probe), so learner-authored code in a container would live on an overlay filesystem and
# be lost if the pod restarted. A VM disk survives a process restart. The VM also carries
# the Go and Node toolchains that Module 6 needs regardless.
#
# Two constraints found by testing, both undocumented and both silent when violated:
#
#   1. Base images must be Debian-family. Instruqt injects its own sandbox-agent as PID 1
#      and an Alpine/musl image (nicolaka/netshoot) failed to provision with an SSH
#      handshake error. This is why postgres is not the -alpine tag.
#
#   2. Instruqt ignores the image's WORKDIR and runs from /. Mattermost's plugin paths are
#      relative by default, so plugin startup fails with
#      "mkdir ./client/plugins: no such file or directory". That would have broken all of
#      Module 6, as a warning in a log rather than a crash. The MM_PLUGINSETTINGS_*
#      variables below pin them absolutely.

containers:
- name: postgres
  image: postgres:15
  memory: 1024
  environment:
    POSTGRES_USER: mmuser
    POSTGRES_PASSWORD: mmuser_password
    POSTGRES_DB: mattermost

- name: mattermost
  image: mattermost/mattermost-team-edition:10.5
  memory: 2048

  # Constraint 3, same shape as the two above: `command:` is ignored here, so the
  # container's startup cannot be wrapped or delayed. Verified, not assumed. A
  # `command: ["bash","-c","...wait for postgres...; exec mattermost"]` entry passed
  # `instruqt track validate`, pushed, and had no effect: the server still started
  # immediately and still died with "cannot create store". Assume `entrypoint:` is the
  # same and do not spend another run on it.
  #
  # This matters because Mattermost loses a DNS race on every single boot. The container
  # starts before the sandbox has a record for `postgres`, and Mattermost gives the
  # database about 8 seconds before exiting fatally: DBPingAttempts is 5
  # (channels/store/sqlstore/store.go) with a 2s DBConnRetrySleep
  # (public/utils/sql/sql_utils.go), both compile-time constants, and an NXDOMAIN returns
  # instantly rather than consuming the 10s ping timeout. No setting changes any of that.
  #
  # So the race cannot be eliminated from here, and setup-mattermost relaunching the
  # server by hand stays load-bearing. Controlling startup would mean baking a custom
  # image, which is already on the list below for other reasons.
  ports:
  - 8065
  environment:
    MM_SQLSETTINGS_DRIVERNAME: postgres
    MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
    MM_SERVICESETTINGS_SITEURL: http://mattermost:8065

    # Required. See constraint 2 above.
    MM_PLUGINSETTINGS_DIRECTORY: /mattermost/plugins
    MM_PLUGINSETTINGS_CLIENTDIRECTORY: /mattermost/client/plugins
    MM_PLUGINSETTINGS_ENABLE: "true"
    MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"

    # Mattermost calls labsvc on the VM, which resolves to a private address. Without
    # this it refuses the connection and every integration in the track fails silently.
    MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "workbench localhost 127.0.0.1"

    # Required for the WebSocket to connect, which is what makes the client feel alive:
    # without it every channel needs a manual refresh and a red "Mattermost unreachable,
    # ask your administrator to check WebSocket port" banner sits across the top.
    #
    # Mattermost origin-checks the WebSocket upgrade (and only the upgrade, which is why
    # the REST API works and the channel list renders normally). The default checker
    # compares the browser's Origin host AND scheme against SiteURL
    # (channels/app/server.go OriginChecker). SiteURL here is the internal
    # http://mattermost:8065, while the learner's browser arrives from
    # https://<generated>.env.play.instruqt.com, so both halves mismatch.
    #
    # "*" is checked before SiteURL is consulted at all (channels/utils/api.go
    # CheckOrigin), so it works without knowing the per-participant hostname Instruqt
    # generates. Setting SiteURL to that hostname would be the tighter fix, but it is only
    # knowable at runtime, and this is a single-participant sandbox that is destroyed at
    # the end of the session.
    MM_SERVICESETTINGS_ALLOWCORSFROM: "*"

    # Makes the curriculum's "5-second timeout" lesson in Module 4 literally true. The
    # default is far longer.
    MM_SERVICESETTINGS_OUTGOINGINTEGRATIONREQUESTSTIMEOUT: "5"

    MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "true"
    MM_SERVICESETTINGS_ENABLEOUTGOINGWEBHOOKS: "true"
    MM_SERVICESETTINGS_ENABLECOMMANDS: "true"
    MM_SERVICESETTINGS_ENABLEPOSTUSERNAMEOVERRIDE: "true"
    MM_SERVICESETTINGS_ENABLEPOSTICONOVERRIDE: "true"

    # lab-seed creates bot accounts and personal access tokens. Both are off by default,
    # and both fail with a permissions error rather than anything descriptive.
    MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
    MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"

virtualmachines:
- name: workbench
  # Docker is no longer needed here now that Mattermost and Postgres are containers, so a
  # stock Ubuntu base is enough. Verified to boot and run lifecycle scripts.
  #
  # TODO: bake a custom image with the toolchains, Go module cache and node_modules
  # pre-installed. Track setup installs them at runtime and that is measured at 5m38s,
  # ~3m20s of it the Go dependency tree for the Module 6 plugin. Hot start would move that
  # before the learner arrives, but it is not enabled on this track, so today they watch
  # all of it on the loading screen.
  image: ubuntu-os-cloud/ubuntu-2204-lts
  shell: /bin/bash
  machine_type: n1-standard-2
  ports:
  # labsvc: recording proxy, mock services, grader, inspector
  - 4000
  # the learner's handler
  - 3000
  # code-server
  - 8080
