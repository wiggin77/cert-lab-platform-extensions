<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Inspector</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #23272f;
    --line: #30353f;
    --fg: #e6e9ef;
    --dim: #9aa3b2;
    --ok: #4fb477;
    --warn: #d9a441;
    --bad: #e0656b;
    --in: #6ea8fe;
    --out: #b08ee6;
    --mock: #4bb8bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 18px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .2px; }
  .status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.live { background: var(--ok); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  button.f {
    background: var(--panel-2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer;
  }
  button.f[aria-pressed="true"] { color: var(--fg); border-color: var(--dim); }
  button.act {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer;
  }
  button.act:hover { border-color: var(--dim); }
  main { padding: 14px 18px 60px; max-width: 1180px; }
  .urls {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .urls h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin: 0 0 8px; }
  .urls table { border-collapse: collapse; width: 100%; }
  .urls td { padding: 3px 10px 3px 0; vertical-align: top; }
  .urls td:first-child { color: var(--dim); white-space: nowrap; }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  code { font-size: 12.5px; }
  .ev {
    border: 1px solid var(--line); border-left-width: 3px; border-radius: 7px;
    background: var(--panel); margin-bottom: 8px; overflow: hidden;
  }
  .ev.mm_to_handler { border-left-color: var(--in); }
  .ev.handler_to_mm { border-left-color: var(--out); }
  .ev.delayed_response { border-left-color: var(--out); }
  .ev.feed_fire, .ev.intel_query, .ev.llm_call { border-left-color: var(--mock); }
  .ev.grader_assert, .ev.grader_stimulus, .ev.admin { border-left-color: var(--warn); }
  .head {
    display: flex; gap: 10px; align-items: center; padding: 9px 12px; cursor: pointer;
    flex-wrap: wrap;
  }
  .head:hover { background: var(--panel-2); }
  .seq { color: var(--dim); font-size: 11.5px; min-width: 34px; font-family: ui-monospace, monospace; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim); min-width: 128px; }
  .route { font-family: ui-monospace, monospace; font-size: 12.5px; flex: 1; min-width: 190px; }
  .st { font-family: ui-monospace, monospace; font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--panel-2); }
  .st.ok { color: var(--ok); }
  .st.warn { color: var(--warn); }
  .st.bad { color: var(--bad); }
  .ms { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; min-width: 62px; text-align: right; }
  .ms.slow { color: var(--warn); }
  .notes { padding: 0 12px 9px 56px; }
  .note {
    background: rgba(217,164,65,.10); border-left: 2px solid var(--warn);
    padding: 6px 10px; margin-top: 5px; font-size: 12.5px; border-radius: 0 4px 4px 0;
  }
  .body { display: none; border-top: 1px solid var(--line); padding: 10px 12px; }
  .ev.open .body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 820px) { .ev.open .body { grid-template-columns: 1fr; } }
  .pane h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin: 0 0 6px; }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px;
    padding: 9px; margin: 0; overflow: auto; max-height: 340px; font-size: 12px;
  }
  .empty { color: var(--dim); padding: 34px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Lab Inspector</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">connecting</span></div>
  <button class="act" id="clear">Clear view</button>
  <button class="act" id="fire">Fire alert</button>
  <div class="filters" id="filters"></div>
</header>

<main>
  <section class="urls">
    <h2>Paste these into Mattermost</h2>
    <table id="urls"><tbody></tbody></table>
  </section>
  <div id="events"></div>
  <div class="empty" id="empty">No traffic yet. Fire an alert, or trigger an integration in Mattermost.</div>
</main>

<script>
const KINDS = [
  ['mm_to_handler', 'Mattermost to handler'],
  ['handler_to_mm', 'Handler to Mattermost'],
  ['delayed_response', 'Delayed response'],
  ['feed_fire', 'Feed'],
  ['intel_query', 'Intel'],
  ['llm_call', 'LLM'],
  ['grader_assert', 'Grader'],
  ['admin', 'Admin'],
];

const active = new Set(KINDS.map(([k]) => k));
const events = [];

const $events = document.getElementById('events');
const $empty = document.getElementById('empty');
const $filters = document.getElementById('filters');

for (const [kind, label] of KINDS) {
  const b = document.createElement('button');
  b.className = 'f';
  b.textContent = label;
  b.setAttribute('aria-pressed', 'true');
  b.onclick = () => {
    active.has(kind) ? active.delete(kind) : active.add(kind);
    b.setAttribute('aria-pressed', String(active.has(kind)));
    render();
  };
  $filters.appendChild(b);
}

function statusClass(s) {
  if (s === undefined || s === null) return '';
  if (s >= 500) return 'bad';
  if (s >= 400) return 'warn';
  return 'ok';
}

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
}

function render() {
  const visible = events.filter((e) => active.has(e.kind));
  $empty.style.display = visible.length ? 'none' : 'block';
  $events.innerHTML = '';

  for (const e of visible.slice().reverse()) {
    const div = document.createElement('div');
    div.className = 'ev ' + e.kind;

    const status = e.response && e.response.status;
    const slow = e.durationMs !== undefined && e.durationMs > 3000;

    div.innerHTML =
      '<div class="head">' +
        '<span class="seq">#' + e.seq + '</span>' +
        '<span class="kind">' + esc(e.kind.replace(/_/g, ' ')) + '</span>' +
        '<span class="route">' + esc((e.request && e.request.method ? e.request.method + ' ' : '') + e.route) + '</span>' +
        (status !== undefined && status !== null ? '<span class="st ' + statusClass(status) + '">' + status + '</span>' : '') +
        (e.durationMs !== undefined ? '<span class="ms' + (slow ? ' slow' : '') + '">' + e.durationMs + 'ms</span>' : '') +
      '</div>' +
      ((e.notes || []).length
        ? '<div class="notes">' + e.notes.map((n) => '<div class="note">' + esc(n) + '</div>').join('') + '</div>'
        : '') +
      '<div class="body">' +
        '<div class="pane"><h3>Request</h3><pre>' + esc(JSON.stringify(e.request, null, 2)) + '</pre></div>' +
        '<div class="pane"><h3>Response</h3><pre>' + esc(JSON.stringify(e.response ?? null, null, 2)) + '</pre></div>' +
      '</div>';

    div.querySelector('.head').onclick = () => div.classList.toggle('open');
    $events.appendChild(div);
  }
}

function add(event) {
  events.push(event);
  if (events.length > 500) events.shift();
  render();
}

fetch('/api/urls').then((r) => r.json()).then((d) => {
  const tbody = document.querySelector('#urls tbody');
  for (const i of d.integrations) {
    tbody.insertAdjacentHTML('beforeend',
      '<tr><td>' + esc(i.label) + ' <span style="opacity:.55">(mod ' + i.module + ')</span></td>' +
      '<td><code>' + esc(i.url) + '</code></td></tr>');
  }
  tbody.insertAdjacentHTML('beforeend',
    '<tr><td>Mattermost API, via proxy</td><td><code>' + esc(d.mattermostProxyBaseUrl) + '</code></td></tr>' +
    '<tr><td>Mock threat intel</td><td><code>' + esc(d.mockIntelBaseUrl) + '</code></td></tr>' +
    '<tr><td>Mock LLM</td><td><code>' + esc(d.mockLlmBaseUrl) + '</code></td></tr>');
});

fetch('/api/journal?limit=200').then((r) => r.json()).then((d) => {
  d.events.forEach((e) => events.push(e));
  render();
});

const source = new EventSource('/api/journal/stream');
source.onopen = () => {
  document.getElementById('dot').classList.add('live');
  document.getElementById('conn').textContent = 'live';
};
source.onerror = () => {
  document.getElementById('dot').classList.remove('live');
  document.getElementById('conn').textContent = 'reconnecting';
};
source.onmessage = (m) => add(JSON.parse(m.data));

document.getElementById('clear').onclick = () => {
  events.length = 0;
  render();
};

document.getElementById('fire').onclick = async (ev) => {
  ev.target.disabled = true;
  try {
    await fetch('/mock/feed/fire', {method: 'POST', headers: {'content-type': 'application/json'}, body: '{}'});
  } finally {
    ev.target.disabled = false;
  }
};
</script>
</body>
</html>
